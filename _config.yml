# ---------------------------------------------------------------------------
# MCF2 Lab website — site settings
# Restart `jekyll serve` after editing this file.
# ---------------------------------------------------------------------------

title: "MCF2 Lab"
long_title: "Multiphase and Complex Fluids Flow Lab"
tagline: "Computational fluid dynamics for polydisperse multiphase, turbulent mixing and reacting flows"
description: >-
  The Multiphase and Complex Fluids Flow (MCF2) Lab at California State University,
  Long Beach develops accurate and tractable computational models for polydisperse
  multiphase flows, turbulent mixing and reacting flows.
url: "https://mcf2-lab.github.io"
baseurl: ""
locale: en-US
timezone: America/Los_Angeles
repository: "MCF2-Lab/MCF2-Lab.github.io"

# Principal investigator and lab contact
pi:
  name: "Ehsan Madadi"
  title: "Assistant Professor of Mechanical and Aerospace Engineering"
  email: "ehsan.madadi@csulb.edu"
  photo: "/images/ehsan.jpg"
  office: "ECS 621"

lab:
  department: "Department of Mechanical and Aerospace Engineering"
  university: "California State University, Long Beach"
  room: "Vivian Engineering Center (VEC) 215"
  room_short: "VEC 215"
  street: "1250 Bellflower Blvd."
  city: "Long Beach, CA 90840"

# Profile links. Leave a value empty to hide its icon.
links:
  github: "https://github.com/MCF2-Lab"          # lab
  github_personal: "https://github.com/ehsanMa86"
  google_scholar: "https://scholar.google.com/citations?user=LEiNNr8AAAAJ"
  orcid: "https://orcid.org/0000-0003-3216-3245"
  researchgate: ""
  linkedin: ""
  csulb_profile: ""

# Default social-sharing image
og_image: "/assets/media/projects/nsf-cijr-render.jpg"

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
collections:
  news:
    output: true
    permalink: /:collection/:path/
  outreach:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: news }
    values: { layout: post, back_url: /news/, back_label: "All news" }
  - scope: { path: "", type: outreach }
    values: { layout: post, back_url: /outreach/, back_label: "All outreach" }

include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - node_modules

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  collections:
    news:
      path: "/news/feed.xml"

# Show news dated in the future (for example, an announced graduation date)
future: true
