---
layout: default
---
<header class="page-hero page-hero--flow{% if page.hero_image %} page-hero--image{% endif %}"{% if page.hero_image %} style="--hero-img: url('{{ page.hero_image | relative_url }}')"{% endif %}>
  {% include flow-bg.html %}
  <div class="container">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
{%- if page.wide %}
{{ content }}
{%- else %}
<div class="container section">
  <div class="prose">
{{ content }}
  </div>
</div>
{%- endif %}
